name: Workshop tally
description: Your board for the two days. Open one, title it with your name, keep it updated.
title: "Tally — YOUR NAME"
labels: ["tally"]
body:
  - type: markdown
    attributes:
      value: |
        One of these per participant. Update the table as each run lands, and post a comment
        with the row when you fill it — the comment is what makes the trail append-only.

        **Report what you measured, either way.** A run that got worse is a finding, and it
        goes on the board unchanged.

  - type: textarea
    id: tally
    attributes:
      label: Tally
      description: >-
        Counting rules — turns: every prompt sent, repair prompts included · tool calls: files the
        AGENT read and searches it ran, not the ticket fetch · asked: questions a file in the repo
        could have answered · rework: repair prompts sent (also counted as turns) · churn: lines
        written then discarded, nearest ten · clock: minutes from the first prompt until all the
        lab's checks pass (a change you would raise a PR for), or the timebox if you stop there.
      value: |
        | Run | Ticket | Turns | Tool calls | Asked | Rework | Churn | Clock |
        |---|---|---|---|---|---|---|---|
        | **1.1** — unprepared repository | GB-142 |  |  |  |  |  |  |
        | **2.2** — your knowledge in the repo | GB-151 |  |  |  |  |  |  |
        | **capstone** — full pipeline | GB-186 |  |  |  |  |  |  |

        Rows 1.1 and 2.2 are the comparison — same repo, matched ticket size, same 35-minute
        working window. The only thing that changed is what was written down.
    validations:
      required: true

  - type: textarea
    id: passrate
    attributes:
      label: Lab 3.2 — the prompt A/B
      description: This one is a pass rate, not the six counters. A pass on the ambiguous tickets means the agent stopped and asked.
      value: |
        | | Passed | of |
        |---|---|---|
        | Ordinary request |  | 6 |
        | Engineered request + skill file |  | 6 |

        Changed (tickets whose result changed between the two): 
    validations:
      required: false

  - type: textarea
    id: capstone
    attributes:
      label: Capstone — per acceptance criterion
      description: >-
        Only three columns compare to row 1.1, and they compare per criterion — five for GB-142,
        six for GB-186. Turns, tool calls and clock are absolute only; GB-186 is the bigger piece
        of work, so they are expected to be higher.
      value: |
        | Per criterion | 1.1 (÷5) | capstone (÷6) |
        |---|---|---|
        | Asked |  |  |
        | Rework |  |  |
        | Churn |  |  |

        Which stage cost the most, and was it worth it?
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything that would make these numbers hard to defend
      description: Contaminated baseline, interrupted run, a careful performance rather than an ordinary Tuesday — say so here.
    validations:
      required: false
